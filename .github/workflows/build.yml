name: Build

# The program is standalone now, so the build does not publish a plugin into
# Dalamud any more. It assembles the installation and, when the commit message
# carries the marker below, publishes it as a release of this repository.

on:
  workflow_dispatch:
  push:
    branches:
    - API11
    - CN
    - main
    - 备战8.0

jobs:
  build:
    runs-on: windows-latest
    outputs:
      timestamp: ${{ steps.timestamp.outputs.timestamp }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: XIVSlothComboX.UI/package-lock.json
    - name: Setup clang
      run: |
        $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
        if (Test-Path $llvm) { echo $llvm >> $env:GITHUB_PATH }
        clang --version
    - name: Build the standalone program
      run: .\build\publish.ps1
    - name: Run the tests
      run: dotnet run --project tests\SlothCombo.Tests\SlothCombo.Tests.csproj -c Release
    - name: Set Timestamp
      id: timestamp
      run: |
        $timestamp = Get-Date -Format "yyyy-MM-dd-HH-mm-ss"
        echo "timestamp=$timestamp" >> $env:GITHUB_OUTPUT
    - name: Pack the installation
      run: Compress-Archive -Path "dist\*" -DestinationPath "SlothCombo.zip" -Force
    - uses: actions/upload-artifact@v4
      with:
        name: "SlothCombo-${{ steps.timestamp.outputs.timestamp }}"
        path: |
          dist
          SlothCombo.zip
        if-no-files-found: error

  deploy:
    needs: build
    if: "contains(toJSON(github.event.commits.*.message), '[PUSH]')"
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: "SlothCombo-${{ needs.build.outputs.timestamp }}"
        path: .
    - name: Publish the installation
      uses: softprops/action-gh-release@v2
      with:
        files: SlothCombo.zip
        tag_name: ${{ needs.build.outputs.timestamp }}
        name: SlothCombo ${{ needs.build.outputs.timestamp }}
